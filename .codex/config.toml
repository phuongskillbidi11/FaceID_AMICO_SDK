# Project-local browser automation for read-only UI verification.
# The MCP server does not receive credentials from this configuration.
[mcp_servers.chrome_devtools]
command = "C:\\Program Files\\nodejs\\npx.cmd"
args = ["-y", "chrome-devtools-mcp@latest", "--no-usage-statistics", "--redactNetworkHeaders"]
startup_timeout_sec = 20

[mcp_servers.chrome_devtools.tools.navigate_page]
approval_mode = "approve"
