<!DOCTYPE html>
<html>
<head>
	<link rel="shortcut icon" href="/images/favicon.ico" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<meta content="" name="description" />
	<meta content="" name="author" />

</head>
<body style="background-color: rgb(61, 61, 61);" class="page-header-fixed ui-mobile-viewport ui-overlay-a page">
	<!-- BEGIN CONTAINER -->
	<div id="MasterConteudo" style="display: none;" class="page-container row-fluid">
	<!-- BEGIN PAGE -->
		<div class="page-content">
			<!-- BEGIN PAGE CONTAINER-->
			<div class="container-fluid">
				<div id="BREADCRUMB" class="row-fluid" cat="cad" ></div>
				<!-- END PAGE HEADER-->
				<!-- BEGIN PAGE CONTENT-->

					<div class="row-fluid">
						<div id="tbl_custom_user"></div>
					</div>
						<div class="clearfix"></div>

				<!-- END PAGE CONTENT-->
			</div>
			<!-- END PAGE CONTAINER-->
		</div>
		<div id="#tempVideo" style="display:none;">
            <video id="video" autoplay style="width: 300px; height:225px !important;"></video>
            <canvas id="canvas" width="300" height="225" ></canvas>
        </div>
	</div>

	<div id="users_pin" class="control-group" style="display:none; height: 250px;">
		<div class="tab-title">PIN</div>
		<div class="row-fluid" id="pin_entry">
			<div class="control-group span6">
				<div class="control-group">
					<label class="control-label" >PIN
					</label>
					<div class="controls">
						<input type="text" id="pin_entry_text" class="m-wrap span10" >
						<span id="pin_validation_error_text" class="font-5 error-desc help-inline float-left"
							  style="color: #d31245; display: none;">PIN must be numeric
						</span>
						<!--<i id="pin_entry-eye" class="icon-eye-open pointer" onclick="toggleVisibilityPIN()"></i>-->
					</div>
				</div>
			</div>
		</div>
		<div class="row-fluid">
			<div class="control-group span6" style="margin-top: 24px;">
				<div class="control-group">
					<label class="control-label" > </label>
					<div class="controls">
						<button class="btn" onclick="enrollOnDevice('pin', false)">Cadastrar PIN no Equipamento</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="face_template_devices" class="control-group" style="display:none; height: 200px;">
		<div class="tab-title">Facial</div>
		<div class="span12">
			<div class="control-group">
				<div class="controls">
					<button class="btn" onclick="enrollFaceOnDevice('face', false)">Register Face on Equipment</button>
				</div>
			</div>
		</div>
		<div class="control-group">
			<div class="span4" id="logFacial" style="margin-left: 5px;" ></div>
			<br/>
		</div>
		<div class="row-flud">
			<div class="control-group span12">
				<div class="control-group">
					<div class="controls">
						<button class="btn" onclick="toggleAdvancedFaceConfigs()">Avançado</button>
					</div>
				</div>
			</div>
		</div>
		<div class="row-fluid" id="advanced-face-configs" style="display: none;">
			<div class="control-group span12">
				<div class="control-group">
					<h4>Custom Recognition Threshold</h4>
					<div class="slidecontainer">
						<input id="inputCustomThreshold" type="range" min="0" max="2000" step="10" class="slider span10">
						<div id="curCustomThreshold"></div>
					</div>
					<br />
					<p><strong>Attention!</strong> Do not change this value if you are not sure of its meaning</p>
				</div>
			</div>
		</div>
	</div>

	<div id="template_devices" class="control-group" style="display:none;">
		<div class="tab-title">Biometrics</div>
		<div class="span12">
			<div class="control-group">
				<label class="control-label" >Number of Fingerprints</label>
				<div class="controls">
					<input type="text" id="num_fingerprint" class="m-wrap span3" disabled>
					<button class="btn" id="delDigitais">Remove Fingerprints</button>
					<button class="btn" id="addDigitais" onclick="CadastrarDigital()">Digital Registration</button>
					<button class="btn" onclick="enrollOnDevice('biometry', false)">Register Digital on the Equipment</button>
				</div>
			</div>
			<div class="control-group">
				<label class="control-label" >Número de Dedos de Pânico</label>
				<div class="controls">
					<input type="text" id="num_duress_fingerprint" class="m-wrap span3" disabled>
					<button class="btn" id="delDuressDigitais">Remover Dedos de Pânico</button>
					<button class="btn" onclick="CadastrarDigital(true)">Cadastrar Dedo de Pânico</button>
					<button class="btn" onclick="enrollOnDevice('biometry', true)">Cadastrar Dedo de Pânico no Equipamento</button>
				</div>
			</div>
		</div>

		<div class="control-group">
			<div class="span8">
				Place your finger to register a new fingerprint:<br/>
				<img id="imgDedo1" width="100" style="margin-right: 10px;" />
				<img id="imgDedo2" width="100" style="margin-right: 10px;"/>
				<img id="imgDedo3" width="100" style="margin-right: 10px;"/>
			</div>
			<div id="logDigital" ></div>
			<br/>
		</div>
	</div>
	<div id="web_login" style="display:none;">
		<div class="tab-title">Web Access</div>

		<div class="span6">
			<div class="control-group no-margin" validate="web_login">
				<label class="control-label" disabled="">Login</label>
				<div class="controls">
					<input type="text" id="txt_web_login" class="m-wrap span12" value="">
				</div>
			</div>
		</div>
		<div class="span6">
			<div class="control-group no-margin" validate="web_password">
				<label class="control-label" disabled="">Password</label>
				<div class="controls">
					<input type="password" id="txt_web_password" class="m-wrap span12" value="">
				</div>
			</div>
		</div>
	</div>
	<!-- END CONTAINER -->

	<!-- BEGIN JAVASCRIPTS(Load javascripts at bottom, this will reduce page load time) -->
	<!-- BEGIN PAGE LEVEL SCRIPTS -->
	<script src="/assets/plugins/jquery-1.11.2.min.js"></script>
	<script src="/en_US/js/main.js"></script>
	<script src="/en_US/js/pages/customusers.js"></script>

	<!-- END JAVASCRIPTS -->
</body>
</html>
